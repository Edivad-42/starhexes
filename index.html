<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e293b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Star Hexes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-512.png">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="utils.js"></script>
  <script src="abilities.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #root {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- Menu and How To Play components -->
  <script type="text/babel">
    // Main Menu Component for Star Hexes
    const MainMenu = ({ onStartGame, onShowHowToPlay, onCustomMatch }) => {
      return (
        <div className="w-full h-full bg-gradient-to-br from-gray-900 via-blue-900 to-purple-900 flex items-center justify-center">
          <div className="text-center space-y-8 px-4">
            {/* Title */}
            <div>
              <h1 className="text-6xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent mb-2">
                STAR HEXES
              </h1>
              <p className="text-gray-400 text-lg tracking-widest">TACTICAL SPACE COMBAT</p>
            </div>

            {/* Main Buttons */}
            <div className="space-y-4">
              <button
                onClick={onStartGame}
                className="w-64 px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white text-xl font-bold rounded-lg shadow-lg hover:shadow-blue-500/50 transition-all transform hover:scale-105 active:scale-95"
              >
                🎯 Quick Match
              </button>

              <button
                onClick={onShowHowToPlay}
                className="w-64 px-8 py-4 bg-purple-600 hover:bg-purple-700 text-white text-xl font-bold rounded-lg shadow-lg hover:shadow-purple-500/50 transition-all transform hover:scale-105 active:scale-95"
              >
                📖 How to Play
              </button>

              {/* Coming Soon Buttons */}
              <button
                onClick={onCustomMatch}
                className="w-64 px-8 py-4 bg-green-600 hover:bg-green-700 text-white text-xl font-bold rounded-lg shadow-lg hover:shadow-purple-500/50 transition-all transform hover:scale-105 active:scale-95"
              >
                Custom Match
              </button>


              <button
                disabled
                className="w-64 px-8 py-4 bg-gray-700 text-gray-500 text-xl font-bold rounded-lg cursor-not-allowed opacity-50"
              >
                ⚙️ Settings <span className="text-sm">(Coming Soon)</span>
              </button>
            </div>

            {/* Version Info */}
            <div className="text-gray-500 text-sm mt-8">
              v0.1.0 Alpha
            </div>
          </div>
        </div>
      );
    };

    // How to Play Component for Star Hexes
    const HowToPlay = ({ onBack }) => {
      return (
        <div className="w-full h-full bg-gray-900 overflow-auto">
          <div className="max-w-3xl mx-auto p-6 text-white">
            {/* Header */}
            <div className="flex items-center justify-between mb-6">
              <h1 className="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                How to Play
              </h1>
              <button
                onClick={onBack}
                className="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors"
              >
                ← Back to Menu
              </button>
            </div>

            {/* Content */}
            <div className="space-y-6 text-gray-300">

              {/* Goal */}
              <section className="bg-gray-800 rounded-lg p-4">
                <h2 className="text-xl font-bold text-blue-400 mb-2">🎯 Goal</h2>
                <p>
                  Win by destroying the enemy Capital Ship (reduce it to 0 HP) OR by eliminating all enemy units.
                </p>
              </section>

              {/* Turn Structure */}
              <section className="bg-gray-800 rounded-lg p-4">
                <h2 className="text-xl font-bold text-blue-400 mb-2">🔄 Turn Structure</h2>
                <p className="mb-2">The game alternates between <strong>Action Phase</strong> and <strong>Combat Phase</strong>:</p>
                <ul className="list-disc list-inside space-y-1 ml-2">
                  <li><strong>Action Phase:</strong> Players take turns activating their units. Each unit can move once per round.</li>
                  <li><strong>Combat Phase:</strong> After all units are activated, simultaneous combat occurs between adjacent enemy units.</li>
                </ul>
              </section>

              {/* Movement & Engagement */}
              <section className="bg-gray-800 rounded-lg p-4">
                <h2 className="text-xl font-bold text-blue-400 mb-2">🚀 Movement & Engagement</h2>
                <ul className="list-disc list-inside space-y-1 ml-2">
                  <li>Units can move to any adjacent hex (1 hex per turn by default).</li>
                  <li><strong>Engaged Units:</strong> If a unit is adjacent to an enemy, it is <strong>engaged</strong> and <strong>cannot move</strong>.</li>
                  <li>You can choose to <strong>Pass</strong> without moving if needed.</li>
                </ul>
              </section>

              {/* Combat */}
              <section className="bg-gray-800 rounded-lg p-4">
                <h2 className="text-xl font-bold text-blue-400 mb-2">⚔️ Combat</h2>
                <ul className="list-disc list-inside space-y-1 ml-2">
                  <li>Combat happens automatically during the Combat Phase.</li>
                  <li>Units deal damage to all adjacent enemies simultaneously.</li>
                  <li>If a unit has multiple adjacent enemies, its damage is split evenly among them.</li>
                  <li>Combat events appear in the feed at the top of the screen.</li>
                </ul>
              </section>

              {/* Abilities */}
              <section className="bg-gray-800 rounded-lg p-4">
                <h2 className="text-xl font-bold text-blue-400 mb-2">⚡ Abilities</h2>
                <ul className="list-disc list-inside space-y-1 ml-2">
                  <li><strong>Active Abilities:</strong> Can be triggered by clicking the ability button when a unit is selected. Some abilities have limited charges or cooldowns.</li>
                  <li><strong>Movement Abilities:</strong> Replace your normal movement (e.g., Boost lets you move 2 hexes instead of 1).</li>
                  <li><strong>Attack Abilities:</strong> Allow ranged attacks or special effects. You can still move after using these.</li>
                  <li><strong>Passive Abilities:</strong> Always active and provide constant bonuses (shown as disabled buttons for reference).</li>
                  <li>Click the <strong>ℹ️ Info</strong> button to see details about any unit's abilities.</li>
                </ul>
              </section>

              {/* Capital Ships */}
              <section className="bg-gray-800 rounded-lg p-4">
                <h2 className="text-xl font-bold text-blue-400 mb-2">🛡️ Capital Ships</h2>
                <ul className="list-disc list-inside space-y-1 ml-2">
                  <li>Each player has a Capital Ship in their home zone (3 hexes highlighted in blue or red).</li>
                  <li>Capital Ships don't move but have high HP.</li>
                  <li>Units in the enemy's capital zone can damage the Capital Ship if they're not engaged with enemy units.</li>
                  <li>The amount of damage depends on the unit's <strong>Capital Damage</strong> stat.</li>
                </ul>
              </section>

              {/* Tips */}
              <section className="bg-gray-800 rounded-lg p-4">
                <h2 className="text-xl font-bold text-blue-400 mb-2">💡 Tips</h2>
                <ul className="list-disc list-inside space-y-1 ml-2">
                  <li>Use the Info button to inspect any unit (yours or enemy) to see their stats and abilities.</li>
                  <li>Plan your moves carefully - engaged units can't retreat!</li>
                  <li>Different unit types excel at different roles: fighters for combat, bombers for capital ships.</li>
                  <li>Watch your ability cooldowns and charges to maximize their impact.</li>
                </ul>
              </section>

            </div>

            {/* Bottom spacing */}
            <div className="h-8"></div>
          </div>
        </div>
      );
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const StarHexesGame = () => {
      // ==================== STATE ====================
      const [gameState, setGameState] = useState('menu');
      const [customSetup, setCustomSetup] = useState({
        player1Faction: null,
        player1Capital: null,
        player1: [],
        player2Faction: null,
        player2Capital: null,
        player2: []
      });
      const [config, setConfig] = useState(null);
      const [units, setUnits] = useState([]);
      const [capitalShips, setCapitalShips] = useState({ player1: null, player2: null });
      const [currentPlayer, setCurrentPlayer] = useState(1);
      const [selectedUnit, setSelectedUnit] = useState(null);
      const [infoTarget, setInfoTarget] = useState(null);
      const [currentValidHexes, setCurrentValidHexes] = useState([]);
      const [activatedUnits, setActivatedUnits] = useState(new Set());
      const [gamePhase, setGamePhase] = useState('action'); // 'action' or 'combat'
      const [combatLog, setCombatLog] = useState([]);
      const [showCombatLog, setShowCombatLog] = useState(false);
      const [needsAIMove, setNeedsAIMove] = useState(false);
      const [activeAbility, setActiveAbility] = useState(null);
      const [winner, setWinner] = useState(null);

      const unitsRef = useRef(units);
      const capitalShipsRef = useRef(capitalShips);
      const activatedRef = useRef(activatedUnits);

      const DEFAULT_SPAWNS = {
        player1: [
          { q: 2, r: 1 },
          { q: 2, r: 2 },
          { q: 1, r: 3 }
        ],
        player2: [
          { q: 7, r: 4 },
          { q: 6, r: 5 },
          { q: 6, r: 6 }
        ]
      };

      useEffect(() => {
        unitsRef.current = units;
        capitalShipsRef.current = capitalShips;
        activatedRef.current = activatedUnits;
      }, [units, capitalShips, activatedUnits]);

      // ==================== LOAD CONFIG ====================
      useEffect(() => {
        fetch('config.json')
          .then(res => res.json())
          .then(data => {
            setConfig(data);

            setCapitalShips({
              player1: {
                ...data.capitalShipTypes.mc80liberty,
                currentHealth: data.capitalShipTypes.mc80liberty.health,
                owner: 1
              },
              player2: {
                ...data.capitalShipTypes.isd,
                currentHealth: data.capitalShipTypes.isd.health,
                owner: 2
              }
            });

            const initialUnits = [];
            let unitId = 1;

            data.startingUnits.player1.forEach(u => {
              const unitType = data.unitTypes[u.type];
              const unit = {
                id: `p1_${unitId++}`,
                player: 1,
                q: u.q,
                r: u.r,
                health: unitType.health,
                maxHealth: unitType.health,
                type: u.type,
                damage: unitType.damage,
                capitalDamage: unitType.capitalDamage
              };

              AbilitySystem.initAbilities(unit, unitType.abilities || []);
              initialUnits.push(unit);
            });

            unitId = 1;
            data.startingUnits.player2.forEach(u => {
              const unitType = data.unitTypes[u.type];
              const unit = {
                id: `p2_${unitId++}`,
                player: 2,
                q: u.q,
                r: u.r,
                health: unitType.health,
                maxHealth: unitType.health,
                type: u.type,
                damage: unitType.damage,
                capitalDamage: unitType.capitalDamage
              };

              AbilitySystem.initAbilities(unit, unitType.abilities || []);
              initialUnits.push(unit);
            });

            setUnits(initialUnits);
          })
          .catch(err => console.error('Error loading config:', err));
      }, []);

      // ==================== MENU HANDLERS ====================
      const handleStartGame = () => {
        setGameState('game');
      };

      const handleShowHowToPlay = () => {
        setGameState('howtoplay');
      };

      const handleBackToMenu = () => {
        setGameState('menu');
      };

      // ==================== CUSTOM GAME ====================
      const assignSquadronNames = (units, faction1, faction2) => {
        const usedNames = new Set();

        const getUniqueName = (factionId) => {
          const availableNames = config.factions[factionId].squadronNames.filter(
            name => !usedNames.has(name)
          );

          if (availableNames.length === 0) {
            // Fallback se finisci i nomi
            return `Squadron ${Math.floor(Math.random() * 1000)}`;
          }

          const name = availableNames[Math.floor(Math.random() * availableNames.length)];
          usedNames.add(name);
          return name;
        };

        return units.map(unit => ({
          ...unit,
          squadronName: getUniqueName(unit.player === 1 ? faction1 : faction2)
        }));
      };

      const startCustomGame = () => {
        // Imposta le capital ships
        setCapitalShips({
          player1: {
            ...config.capitalShipTypes[customSetup.player1Capital],
            currentHealth: config.capitalShipTypes[customSetup.player1Capital].health,
            owner: 1
          },
          player2: {
            ...config.capitalShipTypes[customSetup.player2Capital],
            currentHealth: config.capitalShipTypes[customSetup.player2Capital].health,
            owner: 2
          }
        });

        //imposta le unità
        const units = [];
        let id = 1;

        customSetup.player1.forEach((type, i) => {
          const def = config.unitTypes[type];
          const spawn = DEFAULT_SPAWNS.player1[i];

          const unit = {
            id: `p1_${id++}`,
            player: 1,
            type,
            q: spawn.q,
            r: spawn.r,
            health: def.health,
            maxHealth: def.health,
            damage: def.damage,
            capitalDamage: def.capitalDamage
          };

          AbilitySystem.initAbilities(unit, def.abilities || []);
          units.push(unit);
        });

        id = 1;
        customSetup.player2.forEach((type, i) => {
          const def = config.unitTypes[type];
          const spawn = DEFAULT_SPAWNS.player2[i];

          const unit = {
            id: `p2_${id++}`,
            player: 2,
            type,
            q: spawn.q,
            r: spawn.r,
            health: def.health,
            maxHealth: def.health,
            damage: def.damage,
            capitalDamage: def.capitalDamage
          };

          AbilitySystem.initAbilities(unit, def.abilities || []);
          units.push(unit);
        });

        // Assegna nomi squadrone
        const namedUnits = assignSquadronNames(
          units,
          customSetup.player1Faction,
          customSetup.player2Faction
        );

        setUnits(namedUnits);
        setGameState('game');
      };

      // ==================== CHECK ALL UNITS ACTIVATED ====================
      useEffect(() => {
        if (gamePhase !== 'action') return;

        const aliveUnits = units.filter(u => u.health > 0);
        if (aliveUnits.length === 0) return;

        const allActivated = aliveUnits.every(u => activatedUnits.has(u.id));

        if (allActivated) {
          console.log('All units activated - starting combat');
          Utils.resolveCombat(unitsRef.current, capitalShipsRef.current, config,
            setUnits, setCapitalShips, setCombatLog, setShowCombatLog, setGamePhase, setWinner);
        }
      }, [activatedUnits, gamePhase, units]);

      // ==================== AI TURN ====================
      useEffect(() => {
        if (!needsAIMove || gamePhase !== 'action' || currentPlayer !== 2) return;

        const timer = setTimeout(() => {
          /*          const aiUnits = units.filter(
                      u => u.player === 2 && !activatedUnits.has(u.id) && u.health > 0
                    );
                    const playerUnits = unitsRef.current.filter(
                      u => u.player === 1 && u.health > 0
                    ); */

          Utils.makeAIMove(config, unitsRef, activatedRef, units, setNeedsAIMove, setCurrentPlayer, setActivatedUnits, setUnits);

          /*           // SE NON CI SONO AZIONI, FINISCI IL TURNO AI
                    if (!result) {
                      endTurn();
                    } */
        }, 1000);


        return () => clearTimeout(timer);
      }, [needsAIMove, gamePhase, currentPlayer, units, activatedUnits]);

      // ==================== COMBAT RESOLUTION ====================

      const handleCombatLogOk = () => {
        console.log('Combat log OK');
        setShowCombatLog(false);
        setCombatLog([]);
        setGamePhase('action');
        setActivatedUnits(new Set());
        setCurrentPlayer(1);
        setSelectedUnit(null);
      };

      // ==================== PLAYER ACTIONS ====================
      const handleUnitClick = (unit) => {
        // SE C'È UN'ABILITÀ DI ATTACCO ATTIVA E CLICCO SU UN BERSAGLIO VALIDO
        if (
          activeAbility &&
          activeAbility.validTargets &&
          Array.isArray(activeAbility.validTargets) &&
          activeAbility.validTargets.some(([aq, ar]) => aq === unit.q && ar === unit.r)
        ) {
          handleAbilityTarget(unit.q, unit.r);
          return; // IMPORTANTE: esci subito senza selezionare l'unità
        }

        // Se cambio unità mentre un'abilità è attiva → disattiva abilità
        if (activeAbility) {
          setActiveAbility(null);
          setCurrentValidHexes([]);
        }

        // Se clicco la stessa unità già selezionata → non fare nulla
        if (selectedUnit && selectedUnit.id === unit.id) {
          return;
        }

        // Seleziona SEMPRE (anche nemici / unità già attivate)
        setSelectedUnit(unit);

        // Solo le mie unità NON attivate possono generare movimenti base
        if (
          unit.player === currentPlayer &&
          !activatedUnits.has(unit.id)
        ) {
          const moves = Utils.getValidMoves(unit, units, config);
          setCurrentValidHexes(moves);
        } else {
          setCurrentValidHexes([]);
        }
      };

      const handleHexClick = (q, r) => {
        if (!selectedUnit) return;

        // MOVIMENTO DA ABILITÀ
        if (
          activeAbility &&
          activeAbility.unitId === selectedUnit.id &&
          activeAbility.validMoves
        ) {
          const isValid = activeAbility.validMoves.some(
            ([mq, mr]) => mq === q && mr === r
          );

          if (!isValid) return;

          setUnits(prev =>
            prev.map(u =>
              u.id === selectedUnit.id ? { ...u, q, r } : u
            )
          );

          const ability = ABILITIES[activeAbility.abilityId];
          ability?.onUse?.(selectedUnit);

          setActiveAbility(null);
          setActivatedUnits(prev => new Set([...prev, selectedUnit.id]));
          setSelectedUnit(null);
          setCurrentPlayer(2);
          setNeedsAIMove(true);
          return;
        }

        // MOVIMENTO NORMALE
        if (selectedUnit.player !== currentPlayer) return;
        if (activatedUnits.has(selectedUnit.id)) return;

        const validMoves = Utils.getValidMoves(selectedUnit, units, config);
        const isValid = validMoves.some(([mq, mr]) => mq === q && mr === r);

        if (!isValid) return;

        setUnits(prev =>
          prev.map(u =>
            u.id === selectedUnit.id ? { ...u, q, r } : u
          )
        );

        setActivatedUnits(prev => new Set([...prev, selectedUnit.id]));
        setSelectedUnit(null);
        setCurrentPlayer(2);
        setNeedsAIMove(true);
      };

      const handlePass = () => {
        if (!selectedUnit || activatedUnits.has(selectedUnit.id)) return;

        if (selectedUnit.player !== currentPlayer) return;

        setActivatedUnits(prev => new Set([...prev, selectedUnit.id]));
        setSelectedUnit(null);
        setCurrentPlayer(2);
        setNeedsAIMove(true);
      };

      const activateAbility = (unit, abilityId) => {
        // toggle off
        if (
          activeAbility &&
          activeAbility.unitId === unit.id &&
          activeAbility.abilityId === abilityId
        ) {
          setActiveAbility(null);
          return;
        }

        const ability = ABILITIES[abilityId];
        if (!ability) return;

        let data = {};

        if (ability.trigger === 'movement') {
          const result = ability.effect(
            unit,
            gameStateForAbilities,
            { getNeighbors: Utils.getNeighbors }
          );
          data.validMoves = result?.validMoves || [];
        }

        if (ability.trigger === 'attack') {
          const result = ability.effect(
            unit,
            gameStateForAbilities,
            { getNeighbors: Utils.getNeighbors }
          );
          data.validTargets = result?.targetHexes || [];
        }

        setActiveAbility({
          unitId: unit.id,
          abilityId,
          ...data
        });
      };

      const handleAbilityTarget = (q, r) => {
        if (!activeAbility) return;

        const { unitId, abilityId } = activeAbility;
        const unit = unitsRef.current.find(u => u.id === unitId);
        if (!unit) return;

        const ability = ABILITIES[abilityId];
        const result = ability.onUse(unit, { q, r });

        // aggiorna danni
        if (result?.damage) {
          setUnits(prev =>
            prev.map(u =>
              u.q === q && u.r === r
                ? { ...u, health: Math.max(0, u.health - result.damage) }
                : u
            )
          );
        }

        // 🔥 FORZA REACT A VEDERE IL CAMBIAMENTO DI CARICHE
        setUnits(prev =>
          prev.map(u =>
            u.id === unit.id
              ? { ...u, abilityStates: { ...u.abilityStates } }
              : u
          )
        );

        setActiveAbility(null);
      };

      // ==================== RENDERING ====================
      const hexSize = config?.map.hexSize;
      const hexWidth = hexSize * Math.sqrt(3);
      const hexHeight = hexSize * 2;
      const vertDist = hexHeight * 0.75;
      const liveSelectedUnit = selectedUnit
        ? units.find(u => u.id === selectedUnit.id)
        : null;
      const gameStateForAbilities = {
        config,
        getUnitAt: (q, r) => Utils.getUnitAt(units, q, r),
        isOccupied: (q, r, excludeId) => Utils.isOccupied(units, q, r, excludeId),
        isEngaged: (unit) => Utils.isEngaged(unit, units)
      };

      // ==================== CUSTOM MATCH POINTS ====================
      const p1Points = Utils.calculatePoints(customSetup.player1, customSetup.player1Capital);
      const p2Points = Utils.calculatePoints(customSetup.player2, customSetup.player2Capital);

      const renderUnitActions = () => {
        if (!selectedUnit) return null;

        const isMine =
          selectedUnit.player === 1 &&
          gamePhase === 'action';

        const isActivated = activatedUnits.has(selectedUnit.id);

        return (
          <>
            {/* HEADER */}
            <div className="mb-2">
              <div className="text-white font-bold">
                {config.unitTypes[selectedUnit.type].name}
              </div>
              <div className="text-xs text-gray-400">
                {selectedUnit.squadronName}
              </div>
            </div>

            {/* PASS */}
            {isMine && !isActivated && (
              <button
                onClick={handlePass}
                className="w-full px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded"
              >
                ⏭ Pass
              </button>
            )}

            {/* ABILITÀ */}
            {isMine &&
              AbilitySystem
                .getAvailableAbilities(selectedUnit, gameStateForAbilities)
                .filter(a => a.type === 'active')
                .map(ability => {
                  const active = activeAbility?.abilityId === ability.id;
                  const abilityDef = ABILITIES[ability.id];
                  const disabled =
                    abilityDef?.canUse
                      ? !abilityDef.canUse(selectedUnit, gameStateForAbilities)
                      : false;

                  return (
                    <button
                      key={ability.id}
                      disabled={isActivated || disabled}
                      onClick={() => activateAbility(selectedUnit, ability.id)}
                      className={`w-full px-3 py-2 rounded text-white
            ${(isActivated || disabled)
                          ? 'bg-gray-600 opacity-40 cursor-not-allowed'
                          : active
                            ? 'bg-yellow-600'
                            : 'bg-purple-700 hover:bg-purple-800'}
          `}
                    >
                      {ability.icon} {ability.name}
                      {ability.state?.charges !== undefined && (
                        <span className="ml-2 text-xs opacity-80">
                          ({ability.state.charges})
                        </span>
                      )}
                    </button>
                  );
                })}

            {/* INFO – SEMPRE VISIBILE */}
            <button
              onClick={() => setInfoTarget({ kind: 'unit', data: selectedUnit })}
              className="w-full mt-auto px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-bold"
            >
              ℹ️ Info
            </button >
          </>
        );
      };

      return (
        <>
          {!config && (
            <div className="w-full h-full bg-gray-800 flex items-center justify-center">
              <div className="text-white text-xl">Loading...</div>
            </div>
          )}

          {config && gameState === 'menu' && (
            <MainMenu
              onStartGame={handleStartGame}
              onShowHowToPlay={handleShowHowToPlay}
              onCustomMatch={() => setGameState('custom')}
            />
          )}

          {config && gameState === 'howtoplay' && (
            <HowToPlay onBack={handleBackToMenu} />
          )}

          {config && gameState === 'game' && (
            <div className="w-full h-full bg-gray-800 flex flex-col">
              <div className="w-full h-full bg-gray-800 flex flex-col">
                {/* Top Bar */}
                <div className="flex justify-center items-center py-2 bg-gray-900 text-white">
                  {gamePhase === 'action' ? (
                    <>
                      <span className={currentPlayer === 1 ? 'text-blue-400' : 'text-red-400'}>
                        P{currentPlayer}
                      </span>
                      {' '}- {currentPlayer === 1 ? 'Move unit' : 'AI thinking...'}
                    </>
                  ) : (
                    <span className="text-yellow-400">COMBAT</span>
                  )}
                </div>

                {/* Game Board */}
                <div className="flex-1 bg-gray-900 flex items-center justify-center overflow-hidden">
                  <svg viewBox="0 0 600 400" className="max-w-full max-h-full" preserveAspectRatio="xMidYMid meet" >
                    {/* Hexes */}
                    {Array.from({ length: config.map.height }, (_, r) =>
                      Array.from({ length: config.map.width }, (_, q) => {
                        if (config.map.disabledHexes.some(h => h.q === q && h.r === r)) return null;

                        const x = hexWidth * q + (r % 2) * (hexWidth / 2) + 40;
                        const y = vertDist * r + 35;

                        const unit = units.find(u => u.q === q && u.r === r && u.health > 0);
                        const isSelected = selectedUnit && selectedUnit.q === q && selectedUnit.r === r;

                        let validMoves = [];

                        if (
                          selectedUnit &&
                          selectedUnit.player === currentPlayer &&
                          !activatedUnits.has(selectedUnit.id)
                        ) {
                          if (activeAbility?.unitId === selectedUnit.id) {
                            validMoves = activeAbility.validMoves || [];
                          } else {
                            validMoves = Utils.getValidMoves(selectedUnit, units, config);
                          }
                        }

                        const isValidMove = validMoves.some(([mq, mr]) => mq === q && mr === r);

                        const isAbilityTarget = activeAbility
                          && activeAbility.unitId === selectedUnit?.id
                          && Array.isArray(activeAbility.validTargets)
                          && activeAbility.validTargets.some(([aq, ar]) => aq === q && ar === r);

                        const isP1Zone = config.capitalZones.player1.some(z => z.q === q && z.r === r);
                        const isP2Zone = config.capitalZones.player2.some(z => z.q === q && z.r === r);

                        let fill = '#1e293b';
                        let stroke = '#475569';
                        let strokeWidth = 2;

                        if (isP1Zone) { fill = '#1e3a5f'; stroke = '#3b82f6'; strokeWidth = 2; }
                        if (isP2Zone) { fill = '#4a1a1a'; stroke = '#ef4444'; strokeWidth = 2; }
                        if (isValidMove) fill = '#064e3b';
                        if (isSelected) fill = '#fbbf24';
                        if (isAbilityTarget) fill = '#7f1d1d';

                        return (
                          <g key={`${q}-${r}`}>
                            <polygon
                              points={`${x},${y - hexSize} ${x + hexSize * 0.866},${y - hexSize / 2} ${x + hexSize * 0.866},${y + hexSize / 2} ${x},${y + hexSize} ${x - hexSize * 0.866},${y + hexSize / 2} ${x - hexSize * 0.866},${y - hexSize / 2}`}
                              fill={fill}
                              stroke={stroke}
                              strokeWidth={strokeWidth}
                              strokeLinejoin="round"
                              onClick={() => {
                                if (unit) {
                                  handleUnitClick(unit);
                                } else {
                                  handleHexClick(q, r);
                                }
                              }}
                              className="cursor-pointer hover:opacity-80"
                            />

                            {unit && (
                              <>
                                <circle
                                  cx={x}
                                  cy={y}
                                  r={20}
                                  fill={config.players[`player${unit.player}`].color}
                                  stroke={activatedUnits.has(unit.id) ? '#22c55e' : '#ffffff'}
                                  strokeWidth="3"
                                  onClick={() => handleUnitClick(unit)}
                                  className="cursor-pointer"
                                />
                                <image
                                  href={config.unitTypes[unit.type].icon}
                                  x={x - 12}
                                  y={y - 12}
                                  width={24}
                                  height={24}
                                  style={{ pointerEvents: 'none' }}
                                />
                                <text
                                  x={x}
                                  y={y + 12}
                                  textAnchor="middle"
                                  fill="white"
                                  fontSize="9"
                                  fontWeight="bold"
                                  style={{ pointerEvents: 'none' }}
                                >
                                  {Math.round(unit.health)}
                                </text>
                              </>
                            )}
                          </g>
                        );
                      })
                    )}
                  </svg>

                  {/* Action Buttons */}
                  <div className="w-64 bg-gray-900 border-l border-gray-700 p-3 flex flex-col gap-2">
                    {selectedUnit && renderUnitActions()}
                  </div>
                </div>
              </div>

              {/* Bottom Status */}
              <div className="grid grid-cols-2 gap-1 p-1 bg-gray-900 text-xs">
                {/* Player 1 */}
                <div className="bg-blue-900 p-1 rounded">
                  <div className="flex justify-between text-white mb-1 items-center">
                    <div
                      className="flex items-center gap-2"
                      onClick={() =>
                        setInfoTarget({
                          kind: 'capital',
                          data: capitalShips.player1
                        })
                      }
                    >
                      <span className="font-bold text-blue-300 cursor-pointer hover:underline" >
                        {capitalShips.player1.name}
                      </span>
                      <button className="text-blue-400 hover:text-blue-200" >
                        ℹ️
                      </button>
                    </div>
                    <span>{units.filter(u => u.player === 1 && u.health > 0).length} units</span>
                  </div>
                  <div className="flex items-center gap-1">
                    <div className="flex-1 bg-gray-700 rounded h-2">
                      <div
                        className="bg-blue-400 h-full"
                        style={{ width: `${(capitalShips.player1?.currentHealth / capitalShips.player1?.health * 100) || 0}%` }}
                      ></div>
                    </div>
                    <span className="text-white text-[10px]">{capitalShips.player1?.currentHealth || 0}</span>
                  </div>
                </div>

                {/* Player 2 */}
                <div className="bg-red-900 p-1 rounded">
                  <div className="flex justify-between text-white mb-1 items-center">
                    <span>{units.filter(u => u.player === 2 && u.health > 0).length} units</span>
                    <div
                      className="flex items-center gap-2"
                      onClick={() =>
                        setInfoTarget({
                          kind: 'capital',
                          data: capitalShips.player2
                        })
                      }
                    >
                      <button className="text-red-400 hover:text-red-200" >
                        ℹ️
                      </button>
                      <span className="font-bold text-red-300 cursor-pointer hover:underline" >
                        {capitalShips.player2.name}
                      </span>
                    </div>
                  </div>
                  <div className="flex items-center gap-1">
                    <div className="flex-1 bg-gray-700 rounded h-2">
                      <div
                        className="bg-red-400 h-full"
                        style={{ width: `${(capitalShips.player2?.currentHealth / capitalShips.player2?.health * 100) || 0}%` }}
                      ></div>
                    </div>
                    <span className="text-white text-[10px]">{capitalShips.player2?.currentHealth || 0}</span>
                  </div>
                </div>
              </div>

              {/* Combat Log Modal */}
              {showCombatLog && (
                <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50">
                  <div className="bg-gray-900 rounded-lg p-6 max-w-2xl w-full mx-4 border-4 border-yellow-500 max-h-[80vh] flex flex-col">
                    <h2 className="text-3xl font-bold text-yellow-400 text-center mb-4">⚔️ COMBAT LOG ⚔️</h2>

                    <div className="flex-1 overflow-y-auto bg-gray-800 rounded p-4 mb-4 font-mono text-sm text-white">
                      {combatLog.map((line, i) => (
                        <div key={i} className="mb-1">{line}</div>
                      ))}
                    </div>

                    <button
                      onClick={handleCombatLogOk}
                      className="w-full px-6 py-3 bg-green-600 hover:bg-green-700 text-white text-xl font-bold rounded-lg"
                    >
                      OK
                    </button>
                  </div>
                </div>
              )}

              {/* Unit Info Modal */}
              {infoTarget && (
                <div
                  className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50"
                  onClick={() => setInfoTarget(false)}
                >
                  {infoTarget.kind === 'unit' && (
                    <div
                      className="bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4 border-4"
                      style={{ borderColor: config.players[`player${selectedUnit.player}`].color }}
                      onClick={(e) => e.stopPropagation()}
                    >
                      <div className="flex items-center gap-4 mb-4">
                        <img src={config.unitTypes[selectedUnit.type].icon} alt="" className="w-16 h-16" />
                        <div>
                          <h2 className="text-2xl font-bold text-white">{config.unitTypes[selectedUnit.type].name}</h2>
                          <p className="text-gray-400 text-sm">{selectedUnit.squadronName}</p>
                        </div>
                      </div>

                      <p className="text-gray-300 mb-4 italic">{config.unitTypes[selectedUnit.type].description}</p>

                      <div className="grid grid-cols-2 gap-3 mb-4">
                        <div className="bg-gray-700 rounded p-2">
                          <div className="text-gray-400 text-xs mb-1">Health</div>
                          <div className="flex items-center gap-2">
                            <div className="flex-1 bg-gray-600 rounded h-3">
                              <div
                                className="bg-green-500 h-full"
                                style={{ width: `${(selectedUnit.health / selectedUnit.maxHealth * 100)}%` }}
                              ></div>
                            </div>
                            <span className="text-white text-sm font-bold">{Math.round(selectedUnit.health)}/{selectedUnit.maxHealth}</span>
                          </div>
                        </div>

                        <div className="bg-gray-700 rounded p-2">
                          <div className="text-gray-400 text-xs">Damage</div>
                          <div className="text-white font-bold text-lg">{selectedUnit.damage}</div>
                        </div>

                        <div className="bg-gray-700 rounded p-2">
                          <div className="text-gray-400 text-xs">Capital Damage</div>
                          <div className="text-white font-bold text-lg">{selectedUnit.capitalDamage}</div>
                        </div>
                      </div>

                      {/* ABILITIES */}
                      <div className="mt-4">
                        <h3 className="text-lg font-bold text-yellow-400 mb-2">
                          Abilities
                        </h3>

                        <div className="space-y-2">
                          {(config.unitTypes[selectedUnit.type].abilities || []).map(abilityId => {
                            const ability = ABILITIES[abilityId];
                            const state = selectedUnit.abilityStates?.[abilityId];

                            if (!ability) return null;

                            return (
                              <div
                                key={abilityId}
                                className="bg-gray-700 rounded p-2 border border-gray-600"
                              >
                                <div className="flex items-center gap-2">
                                  <span className="text-xl">{ability.icon}</span>
                                  <span className="font-bold text-white">
                                    {ability.name}
                                  </span>
                                  <span className="ml-auto text-xs text-gray-400">
                                    {ability.type.toUpperCase()}
                                  </span>
                                </div>

                                <div className="text-gray-300 text-sm mt-1">
                                  {ability.description}
                                </div>

                                {state?.charges !== undefined && (
                                  <div className="text-xs text-gray-400 mt-1">
                                    Charges: {state.charges} / {ability.maxCharges}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      <button
                        onClick={() => setInfoTarget(false)}
                        className="w-full px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg"
                      >
                        Close
                      </button>
                    </div>
                  )}
                  {infoTarget.kind === 'capital' && (
                    <div
                      className="bg-gray-800 rounded-lg p-6 max-w-md w-full mx-4 border-4"
                      style={{ borderColor: config.players[`player${infoTarget.data.owner}`].color }}
                      onClick={(e) => e.stopPropagation()}
                    >
                      <div className="flex items-center gap-4 mb-4">
                        <img src={infoTarget.data.icon} alt="" className="w-16 h-16" />
                        <h2 className="text-2xl font-bold text-white">{infoTarget.data.name}</h2>
                      </div>

                      <p className="text-gray-300 mb-4 italic">{infoTarget.data.description}</p>

                      <div className="grid grid-cols-2 gap-3 mb-4">
                        <div className="bg-gray-700 rounded p-2">
                          <div className="text-gray-400 text-xs mb-1">Health</div>
                          <div className="flex items-center gap-2">
                            <div className="flex-1 bg-gray-600 rounded h-3">
                              <div
                                className="bg-green-500 h-full"
                                style={{ width: `${(infoTarget.data.currentHealth / infoTarget.data.health * 100)}%` }}
                              ></div>
                            </div>
                            <span className="text-white text-sm font-bold">{Math.round(infoTarget.data.currentHealth)}/{infoTarget.data.health}</span>
                          </div>
                        </div>
                      </div>

                      <button
                        onClick={() => setInfoTarget(false)}
                        className="w-full px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg"
                      >
                        Close
                      </button>
                    </div>
                  )}
                </div>
              )}

              {winner && (
                <div className="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50">
                  <div className="bg-gray-900 border-4 border-yellow-500 rounded-xl p-8 text-center">
                    <h1 className="text-4xl font-bold text-yellow-400 mb-4">
                      🏆 PLAYER {winner} WINS!
                    </h1>
                    <p className="text-gray-300 mb-6">
                      {winner === 1
                        ? 'The enemy fleet has been destroyed.'
                        : 'Your fleet has been annihilated.'}
                    </p>
                    <button
                      onClick={() => window.location.reload()}
                      className="px-6 py-3 bg-green-600 hover:bg-green-700 text-white text-xl rounded-lg"
                    >
                      Back to menu
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {config && gameState === 'custom' && (
            <div className="w-full h-full bg-gray-900 text-white flex flex-col items-center p-6 overflow-auto">
              <h1 className="text-3xl font-bold text-purple-400 mb-6">
                Custom Match
              </h1>

              <div className="grid grid-cols-2 gap-8 w-full max-w-5xl">

                {/* PLAYER 1 */}
                <div className="bg-gray-800 rounded-lg p-4 border border-blue-500">
                  <h2 className="text-xl font-bold text-blue-400 mb-4">
                    Player 1
                  </h2>
                  <div className={`text-sm font-bold ${p1Points > config.customGameOptions.pointLimit ? 'text-red-400' : 'text-green-400'}`}>
                    {p1Points} / {config.customGameOptions.pointLimit}
                  </div>

                  {/* SELEZIONE FAZIONE */}
                  {!customSetup.player1Faction ? (
                    <div className="space-y-2">
                      <h3 className="text-sm text-gray-400 mb-2">Choose Faction:</h3>
                      {Object.keys(config.factions).map(factionId => {
                        const faction = config.factions[factionId];
                        return (
                          <button
                            key={factionId}
                            onClick={() => setCustomSetup(s => ({ ...s, player1Faction: factionId }))}
                            className="w-full p-3 bg-gray-700 hover:bg-blue-600 rounded transition-colors"
                          >
                            {faction.name}
                          </button>
                        );
                      })}
                    </div>
                  ) : (
                    <>
                      {/* FAZIONE SCELTA */}
                      <div className="text-sm text-gray-400 mb-3">
                        Faction: <span className="text-white font-bold">{config.factions[customSetup.player1Faction].name}</span>
                        <button
                          onClick={() => setCustomSetup(s => ({ ...s, player1Faction: null, player1Capital: null, player1: [] }))}
                          className="ml-2 text-xs text-red-400 hover:text-red-300 underline"
                        >
                          Change
                        </button>
                      </div>

                      {/* SELEZIONE CAPITAL SHIP */}
                      {!customSetup.player1Capital ? (
                        <div className="mb-4">
                          <h3 className="text-sm text-gray-400 mb-2">Choose Capital Ship:</h3>
                          <div className="space-y-2">
                            {config.factions[customSetup.player1Faction].capitalShips.map(shipType => {
                              const ship = config.capitalShipTypes[shipType];
                              return (
                                <button
                                  key={shipType}
                                  onClick={() => setCustomSetup(s => ({ ...s, player1Capital: shipType }))}
                                  className="w-full flex items-center gap-3 p-3 bg-gray-700 hover:bg-blue-600 rounded transition-colors"
                                >
                                  <img src={ship.icon} alt="" className="w-10 h-10" />
                                  <div className="text-left">
                                    <div className="font-bold">{ship.name}</div>
                                    <div className="text-xs text-gray-400">{ship.health} HP</div>
                                  </div>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      ) : (
                        <>
                          <div className="text-sm text-gray-400 mb-3">
                            Capital: <span className="text-white font-bold">{config.capitalShipTypes[customSetup.player1Capital].name}</span>
                            <button
                              onClick={() => setCustomSetup(s => ({ ...s, player1Capital: null }))}
                              className="ml-2 text-xs text-red-400 hover:text-red-300 underline"
                            >
                              Change
                            </button>
                          </div>

                          {/* SELEZIONE UNITÀ */}
                          <h3 className="text-sm text-gray-400 mb-2">
                            Select Units ({customSetup.player1.length}/3):
                          </h3>
                          <div className="grid grid-cols-2 gap-2">
                            {config.factions[customSetup.player1Faction].units.map(type => {
                              const unit = config.unitTypes[type];
                              const disabled = customSetup.player1.length >= 3;

                              return (
                                <button
                                  key={type}
                                  disabled={disabled}
                                  onClick={() =>
                                    setCustomSetup(s => ({
                                      ...s,
                                      player1: [...s.player1, type]
                                    }))
                                  }
                                  className={`flex items-center gap-2 p-2 rounded
                      ${disabled ? 'bg-gray-700 opacity-40 cursor-not-allowed' : 'bg-gray-700 hover:bg-blue-600'}
                    `}
                                >
                                  <img src={unit.icon} alt="" className="w-6 h-6" />
                                  <span className="text-sm">{unit.name}</span>
                                </button>
                              );
                            })}
                          </div>

                          {/* SELECTED UNITS */}
                          <div className="mt-4 space-y-2">
                            <h3 className="text-sm font-bold text-gray-300 uppercase tracking-wide">
                              Fleet
                            </h3>

                            {/* Capital Ship */}
                            {customSetup.player1Capital && (
                              <div className="flex items-center gap-2 bg-gray-700 rounded p-2">
                                <img
                                  src={customSetup.player1Capital.icon}
                                  className="w-6 h-6"
                                />
                                <div className="flex-1">
                                  <div className="text-sm font-bold">
                                    {customSetup.player1Capital.name}
                                  </div>
                                  <div className="text-xs text-gray-400">
                                    Capital Ship
                                  </div>
                                </div>
                              </div>
                            )}

                            {/* Fighters */}
                            {customSetup.player1.map((unit, i) => {
                              return (
                                <div
                                  key={i}
                                  className="flex items-center gap-2 bg-gray-700 rounded p-2"
                                >
                                  <img src={unit.icon} className="w-6 h-6" />
                                  <div className="flex-1">
                                    <div className="text-sm">{unit.name}</div>
                                    <div className="text-xs text-gray-400">
                                      {unit.cost} pts
                                    </div>
                                  </div>
                                  <button
                                    onClick={() =>
                                      setCustomSetup(s => ({
                                        ...s,
                                        player1: {
                                          ...s.player1,
                                          units: s.player1.filter((_, idx) => idx !== i)
                                        }
                                      }))
                                    }
                                    className="text-red-400 hover:text-red-300"
                                  >
                                    ❌
                                  </button>
                                </div>
                              );
                            })}
                          </div>

                          {/* RESET UNITÀ */}
                          {customSetup.player1.length > 0 && (
                            <button
                              onClick={() => setCustomSetup(s => ({ ...s, player1: [] }))}
                              className="w-full mt-2 px-3 py-1 bg-red-600 hover:bg-red-700 rounded text-sm"
                            >
                              Reset Units
                            </button>
                          )}
                        </>
                      )}
                    </>
                  )}
                </div>

                {/* PLAYER 2 (CPU) */}
                <div className="bg-gray-800 rounded-lg p-4 border border-red-500">
                  <h2 className="text-xl font-bold text-red-400 mb-4">
                    Player 2 (CPU)
                  </h2>
                  <div className={`text-sm font-bold ${p2Points > config.customGameOptions.pointLimit ? 'text-red-400' : 'text-green-400'}`}>
                    {p2Points} / {config.customGameOptions.pointLimit}
                  </div>

                  {/* SELEZIONE FAZIONE */}
                  {!customSetup.player2Faction ? (
                    <div className="space-y-2">
                      <h3 className="text-sm text-gray-400 mb-2">Choose Faction:</h3>
                      {Object.keys(config.factions).map(factionId => {
                        const faction = config.factions[factionId];
                        return (
                          <button
                            key={factionId}
                            onClick={() => setCustomSetup(s => ({ ...s, player2Faction: factionId }))}
                            className="w-full p-3 bg-gray-700 hover:bg-red-600 rounded transition-colors"
                          >
                            {faction.name}
                          </button>
                        );
                      })}
                    </div>
                  ) : (
                    <>
                      {/* FAZIONE SCELTA */}
                      <div className="text-sm text-gray-400 mb-3">
                        Faction: <span className="text-white font-bold">{config.factions[customSetup.player2Faction].name}</span>
                        <button
                          onClick={() => setCustomSetup(s => ({ ...s, player2Faction: null, player2Capital: null, player2: [] }))}
                          className="ml-2 text-xs text-red-400 hover:text-red-300 underline"
                        >
                          Change
                        </button>
                      </div>

                      {/* SELEZIONE CAPITAL SHIP */}
                      {!customSetup.player2Capital ? (
                        <div className="mb-4">
                          <h3 className="text-sm text-gray-400 mb-2">Choose Capital Ship:</h3>
                          <div className="space-y-2">
                            {config.factions[customSetup.player2Faction].capitalShips.map(shipType => {
                              const ship = config.capitalShipTypes[shipType];
                              return (
                                <button
                                  key={shipType}
                                  onClick={() => setCustomSetup(s => ({ ...s, player2Capital: shipType }))}
                                  className="w-full flex items-center gap-3 p-3 bg-gray-700 hover:bg-blue-600 rounded transition-colors"
                                >
                                  <img src={ship.icon} alt="" className="w-10 h-10" />
                                  <div className="text-left">
                                    <div className="font-bold">{ship.name}</div>
                                    <div className="text-xs text-gray-400">{ship.health} HP</div>
                                  </div>
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      ) : (
                        <>
                          <div className="text-sm text-gray-400 mb-3">
                            Capital: <span className="text-white font-bold">{config.capitalShipTypes[customSetup.player2Capital].name}</span>
                            <button
                              onClick={() => setCustomSetup(s => ({ ...s, player2Capital: null }))}
                              className="ml-2 text-xs text-red-400 hover:text-red-300 underline"
                            >
                              Change
                            </button>
                          </div>

                          {/* SELEZIONE UNITÀ */}
                          <h3 className="text-sm text-gray-400 mb-2">
                            Select Units ({customSetup.player2.length}/3):
                          </h3>
                          <div className="grid grid-cols-2 gap-2">
                            {config.factions[customSetup.player2Faction].units.map(type => {
                              const unit = config.unitTypes[type];
                              const disabled = customSetup.player2.length >= 3;

                              return (
                                <button
                                  key={type}
                                  disabled={disabled}
                                  onClick={() =>
                                    setCustomSetup(s => ({
                                      ...s,
                                      player2: [...s.player2, type]
                                    }))
                                  }
                                  className={`flex items-center gap-2 p-2 rounded
                      ${disabled ? 'bg-gray-700 opacity-40 cursor-not-allowed' : 'bg-gray-700 hover:bg-red-600'}
                    `}
                                >
                                  <img src={unit.icon} alt="" className="w-6 h-6" />
                                  <span className="text-sm">{unit.name}</span>
                                </button>
                              );
                            })}
                          </div>

                          {/* SELECTED UNITS */}
                          <div className="mt-4 space-y-2">
                            <h3 className="text-sm font-bold text-gray-300 uppercase tracking-wide">
                              Fleet
                            </h3>

                            {/* Capital Ship */}
                            {customSetup.player2Capital && (
                              <div className="flex items-center gap-2 bg-gray-700 rounded p-2">
                                <img
                                  src={customSetup.player2Capital.icon}
                                  className="w-6 h-6"
                                />
                                <div className="flex-1">
                                  <div className="text-sm font-bold">
                                    {customSetup.player2Capital.name}
                                  </div>
                                  <div className="text-xs text-gray-400">
                                    Capital Ship
                                  </div>
                                </div>
                              </div>
                            )}

                            {/* Fighters */}
                            {customSetup.player2.map((unit, i) => {
                              return (
                                <div
                                  key={i}
                                  className="flex items-center gap-2 bg-gray-700 rounded p-2"
                                >
                                  <img src={unit.icon} className="w-6 h-6" />
                                  <div className="flex-1">
                                    <div className="text-sm">{unit.name}</div>
                                    <div className="text-xs text-gray-400">
                                      {unit.cost} pts
                                    </div>
                                  </div>
                                  <button
                                    onClick={() =>
                                      setCustomSetup(s => ({
                                        ...s,
                                        player2: {
                                          ...s.player2,
                                          units: s.player2.filter((_, idx) => idx !== i)
                                        }
                                      }))
                                    }
                                    className="text-red-400 hover:text-red-300"
                                  >
                                    ❌
                                  </button>
                                </div>
                              );
                            })}
                          </div>

                          {/* RESET UNITÀ */}
                          {customSetup.player2.length > 0 && (
                            <button
                              onClick={() => setCustomSetup(s => ({ ...s, player2: [] }))}
                              className="w-full mt-2 px-3 py-1 bg-red-600 hover:bg-red-700 rounded text-sm"
                            >
                              Reset Units
                            </button>
                          )}
                        </>
                      )}
                    </>
                  )}
                </div>
              </div>

              {/* BOTTONE START */}
              <button
                disabled={
                  !customSetup.player1Faction ||
                  !customSetup.player2Faction ||
                  !customSetup.player1Capital ||
                  !customSetup.player2Capital ||
                  customSetup.player1.length > 1 ||
                  customSetup.player2.length > 1 &&
                  p1Points <= config.customSetupOptions.pointLimit &&
                  p2Points <= config.customSetupOptions.pointLimit
                }
                onClick={startCustomGame}
                className={`mt-8 px-8 py-4 rounded-lg text-xl font-bold
        ${customSetup.player1Faction && customSetup.player2Faction &&
                    customSetup.player1.length === 3 && customSetup.player2.length === 3
                    ? 'bg-green-600 hover:bg-green-700'
                    : 'bg-gray-600 opacity-40 cursor-not-allowed'}
      `}
              >
                Start Match
              </button>

              <button
                onClick={() => setGameState('menu')}
                className="mt-4 text-gray-400 hover:text-white underline"
              >
                Back to Menu
              </button>
            </div>
          )}
        </>
      );
    };

    ReactDOM.render(<StarHexesGame />, document.getElementById('root'));
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>

</html>
